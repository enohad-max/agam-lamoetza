<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>אגם למועצה</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="אגם למועצה">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <header class="hero">
    <button id="mute" class="icon-btn" type="button" aria-label="צלילים" aria-pressed="false">🔊</button>
    <div class="badge">🗳️</div>
    <h1>אגם למועצה!</h1>
    <p class="tagline">כל הכיתה מרוצה!</p>
    <p class="class-name">ד3 יסמין</p>
  </header>

  <main>
    <section class="card countdown" aria-live="polite">
      <div id="count-big" class="count-big">…</div>
      <div id="count-small" class="count-small"></div>
    </section>

    <section class="card">
      <h2>📮 קופסת ההצעות</h2>
      <p class="hint">מה אגם תעשה בשבילך אם תיבחר?</p>

      <div id="mailbox" class="mailbox" aria-hidden="true">📮</div>

      <div class="slot-title">רעיונות מוכנים (לחצו!)</div>
      <div class="chips" id="ideas"></div>

      <label class="slot-title" for="idea-text">ההצעה שלך</label>
      <textarea id="idea-text" class="field" rows="3" maxlength="100" placeholder="כתבו כאן הצעה קצרה…"></textarea>

      <label class="slot-title" for="idea-name">השם שלך (לא חובה)</label>
      <input id="idea-name" class="field" type="text" maxlength="20" autocomplete="off" placeholder="למשל: נועה">

      <button id="drop" class="btn btn-big" type="button">📥 שימו בקופסה!</button>
    </section>

    <section class="card" id="saved-card" hidden>
      <h2>📥 ההצעות שבקופסה</h2>
      <p class="hint">לחצו 📤 כדי לשלוח לאגם בוואטסאפ</p>
      <ul id="saved" class="saved"></ul>
    </section>

    <section class="card install" id="install-card">
      <h2>📱 שימו אותי במסך הבית</h2>
      <p id="install-text" class="hint"></p>
    </section>
  </main>

  <footer>אגם למועצה – כל הכיתה מרוצה! 💜</footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
