<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>אגם למועצה</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="אגם למועצה">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <header class="hero">
    <button id="mute" class="icon-btn" type="button" aria-label="צלילים" aria-pressed="false">🔊</button>
    <div class="badge">🗳️</div>
    <h1>אגם למועצה!</h1>
    <p class="tagline">כל הכיתה מרוצה!</p>
    <p class="class-name">ד3 יסמין</p>
  </header>

  <main>
    <section class="card countdown" aria-live="polite">
      <div id="count-big" class="count-big">…</div>
      <div id="count-small" class="count-small"></div>
    </section>

    <section class="card">
      <h2>🎉 מחולל סלוגנים</h2>
      <p class="hint">בחרו מילה בכל שורה, או לחצו על ההפתעה!</p>

      <div class="slot" data-slot="a"><div class="slot-title">1. מי?</div><div class="chips" id="chips-a"></div></div>
      <div class="slot" data-slot="b"><div class="slot-title">2. למה?</div><div class="chips" id="chips-b"></div></div>
      <div class="slot" data-slot="c"><div class="slot-title">3. צעקה!</div><div class="chips" id="chips-c"></div></div>

      <button id="surprise" class="btn btn-big" type="button">🎲 הפתיעו אותי!</button>

      <div id="result" class="result" hidden>
        <div id="slogan" class="slogan"></div>
        <div class="actions">
          <button id="share-wa" class="btn btn-wa" type="button">שלחו ב-WhatsApp</button>
          <button id="share-native" class="btn" type="button" hidden>שתפו…</button>
          <button id="copy" class="btn" type="button">📋 העתיקו</button>
          <button id="save" class="btn" type="button">⭐ שמרו</button>
        </div>
      </div>
    </section>

    <section class="card" id="saved-card" hidden>
      <h2>⭐ הסלוגנים ששמרתי</h2>
      <ul id="saved" class="saved"></ul>
    </section>

    <section class="card install" id="install-card">
      <h2>📱 שימו אותי במסך הבית</h2>
      <p id="install-text" class="hint"></p>
    </section>
  </main>

  <footer>אגם למועצה – כל הכיתה מרוצה! 💜</footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
